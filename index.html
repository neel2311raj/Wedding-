html,body{height:100%;margin:0;overflow:hidden;background:#0b0705;font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.inv{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:radial-gradient(90% 60% at 50% 30%,#fffdf7,#f3ecdd 70%,#e6dcc8),#f3ecdd}
.inv::before{content:"";position:absolute;inset:0;background:var(--grain)}
.opened .inv{animation:zin 2.6s cubic-bezier(.2,.7,.2,1) both}

.frame{position:relative;height:min(88dvh,165vw);aspect-ratio:300/560;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;padding:19% 9% 9%}
.frame>svg{position:absolute;inset:0;width:100%;height:100%}
.frame path{stroke-dasharray:1600;stroke-dashoffset:1600;transition:stroke-dashoffset 3s ease .2s}
.show .frame path{stroke-dashoffset:0}
.rv{opacity:0;transform:translateY(10px);filter:blur(6px);transition:opacity 1.4s ease var(--d),transform 1.4s ease var(--d),filter 1.4s ease var(--d)}
.show .rv{opacity:1;transform:none;filter:none}
.k{font-size:clamp(.8rem,2.2dvh,1rem);color:var(--gold);letter-spacing:.14em}
.sm{max-width:86%;font-style:italic;font-size:clamp(.85rem,2.3dvh,1.05rem);color:#6b5d4b}
.nm{font:400 clamp(2.3rem,8.6dvh,3.5rem)/1.05 'Pinyon Script',cursive;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(100deg,#2b2118 38%,#c99a3f 47%,#f8e7ad 50%,#c99a3f 53%,#2b2118 62%) 100% 0/280% 100%;-webkit-background-clip:text;background-clip:text}
.nm.rv{opacity:1;filter:none;transform:none;clip-path:inset(-15% 100% -15% -5%);transition:clip-path 2s cubic-bezier(.55,0,.2,1) var(--d)}
.show .nm.rv{clip-path:inset(-15% -5%);animation:shm 5s ease-in-out 4s infinite}
@keyframes shm{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.am{font:italic clamp(1.2rem,3.4dvh,1.6rem) 'Cormorant Garamond',serif;color:var(--gold)}
.lb{font-size:clamp(.7rem,1.9dvh,.85rem);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.tiles{display:flex;gap:3%;width:100%;justify-content:center}
.tile{position:relative;width:29%;aspect-ratio:1;border:1px solid rgba(180,138,60,.6);border-radius:10px;background:#fffdf7;display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,3.6dvh,1.7rem);color:var(--wine);overflow:hidden}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:9px}
.nt{font-style:italic;font-size:clamp(.8rem,2.1dvh,.95rem);color:#7a6b58}
.rays{position:fixed;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;z-index:2;background:repeating-conic-gradient(rgba(255,225,160,.5) 0 3deg,transparent 3deg 10deg);-webkit-mask:radial-gradient(circle,#000,transparent 55%);mask:radial-gradient(circle,#000,transparent 55%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.opened .rays{animation:ry 3s ease forwards}
@keyframes ry{0%{opacity:0;transform:rotate(0)}30%{opacity:1}100%{opacity:0;transform:rotate(40deg)}}
#env{position:fixed;inset:0;z-index:5;cursor:pointer;background:none}
.fl{position:absolute;inset:0;transform-style:flat;will-change:transform,opacity;transition:transform 2s cubic-bezier(.5,0,.2,1),opacity 1.6s ease .5s}
.fl svg{position:absolute;inset:0;width:100%;height:100%}
.ft{clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:50% 0;background:var(--grain),radial-gradient(circle at 50% 58%,rgba(255,196,130,.22),transparent 58%),linear-gradient(180deg,#8f2339,#661629)}
.fb{clip-path:polygon(0 100%,100% 100%,50% 58%);transform-origin:50% 100%;background:var(--grain),radial-gradient(circle at 50% 58%,rgba(255,196,130,.22),transparent 58%),linear-gradient(0deg,#4a0e1d,#74192e)}
.fL{clip-path:polygon(0 0,50% 58%,0 100%);transform-origin:0 50%;background:var(--grain),radial-gradient(circle at 50% 58%,rgba(255,196,130,.22),transparent 58%),linear-gradient(100deg,#7d1c31,#5c1224)}
.fR{clip-path:polygon(100% 0,50% 58%,100% 100%);transform-origin:100% 50%;background:var(--grain),radial-gradient(circle at 50% 58%,rgba(255,196,130,.22),transparent 58%),linear-gradient(260deg,#7d1c31,#581122)}
.open .ft{transform:perspective(1400px) rotateX(-105deg);opacity:0}
.open .fb{transform:perspective(1400px) rotateX(105deg);opacity:0}
.open .fL{transform:perspective(1400px) rotateY(105deg);opacity:0}
.open .fR{transform:perspective(1400px) rotateY(-105deg);opacity:0}
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);mix-blend-mode:soft-light;animation:shn 5s ease-in-out infinite;z-index:3}
@keyframes shn{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.lit .sheen{display:none}
.sealw{position:absolute;left:50%;top:58%;width:var(--w);aspect-ratio:1;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 6px 7px rgba(20,3,8,.65))}
.sealw::before{content:"";position:absolute;inset:-16%;border-radius:50%;background:radial-gradient(circle,rgba(255,252,240,.95),rgba(255,236,190,.5) 40%,transparent 70%);animation:hl 2.8s ease-in-out infinite;z-index:-1}
.seal{position:absolute;inset:0;background:radial-gradient(circle at 36% 30%,#fffdf4,#f4e8c9 55%,#dcc78f);display:flex;align-items:center;justify-content:center;font:italic 500 clamp(1.5rem,7vw,2rem)/1 'Cormorant Garamond',serif;color:#9a7b45;text-shadow:0 1px 0 #fff,0 -1px 1px rgba(80,60,20,.4)}
.lit .seal{animation:none}
.seal::before{content:"";position:absolute;inset:11%;border-radius:50%;border:1px solid rgba(150,125,80,.3);box-shadow:inset 0 2px 3px rgba(90,70,40,.35),0 1px 0 rgba(255,255,255,.9)}
@keyframes hl{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.55);opacity:1}}
.lit .sealw{animation:crk 1.5s ease forwards}
@keyframes crk{0%{transform:translate(-50%,-50%) scale(1)}15%{transform:translate(-52%,-50%) scale(1.05) rotate(-4deg)}30%{transform:translate(-48%,-50%) scale(1.1) rotate(4deg);filter:brightness(1.5) drop-shadow(0 6px 7px rgba(20,3,8,.65))}100%{transform:translate(-50%,-52%) scale(2.2);opacity:0;filter:brightness(3) drop-shadow(0 6px 7px rgba(20,3,8,.65))}}
.seams{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;transition:opacity .5s}.lit .seams{opacity:0}
.star{position:absolute;left:50%;top:58%;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0,rgba(255,244,208,.95) 5%,rgba(255,225,160,.35) 16%,transparent 34%),linear-gradient(90deg,transparent 8%,rgba(255,246,220,.95) 50%,transparent 92%) center/100% 3px no-repeat,linear-gradient(0deg,transparent 8%,rgba(255,246,220,.95) 50%,transparent 92%) center/3px 100% no-repeat}
.star::after{content:"";position:absolute;inset:0;transform:rotate(45deg) scale(.6);background:linear-gradient(90deg,transparent 10%,rgba(255,240,205,.8) 50%,transparent 90%) center/100% 2px no-repeat,linear-gradient(0deg,transparent 10%,rgba(255,240,205,.8) 50%,transparent 90%) center/2px 100% no-repeat}

.bloom{position:absolute;left:50%;top:58%;width:40vmax;height:40vmax;margin:-20vmax 0 0 -20vmax;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff7df 24%,rgba(255,226,160,.8) 44%,transparent 68%);transform:scale(0);opacity:0;z-index:6;pointer-events:none}

@keyframes bl{0%{transform:scale(0);opacity:1}42%{transform:scale(3.6);opacity:1}100%{transform:scale(4);opacity:0}}

.draw .rg .c{animation:dr 2s cubic-bezier(.55,.1,.35,1) forwards}

.rh{position:absolute;inset:0;opacity:0}
.rh::after{content:"";position:absolute;left:50%;top:4%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 4px 2px #fff4cf,0 0 9px 4px rgba(255,200,100,.85)}

@keyframes rgo{to{transform:translate(-50%,-50%) scale(1.1);opacity:0}}

.tw{height:clamp(30px,6.2dvh,52px);aspect-ratio:120/56}.tw svg,.dy{width:100%;height:100%;display:block}
.k{line-height:1.55}

.nt{display:flex;align-items:center;gap:10px}
.dy{width:22px;height:18px;filter:drop-shadow(0 0 4px #ffb84a)}
.fm{transform-origin:11px 9px;animation:fk 1.3s ease-in-out infinite alternate}

#tor{display:none}

.tw{height:92px;aspect-ratio:160/98;z-index:1}
.sd{font:400 clamp(2rem,7dvh,2.8rem)/1 'Pinyon Script',cursive;color:var(--wine)}
.jn{width:26px!important;height:26px!important}

.hero{width:119%;margin:10px -9.5% -4px}.hero svg{width:100%;display:block;overflow:visible}
.scene{position:relative;aspect-ratio:480/424;background:linear-gradient(180deg,#f7e3dc 0%,#f6dfd2 45%,#f2d0b8 80%,#e8bfa5 100%)}

.hint{top:calc(5% + 28px + env(safe-area-inset-top,0px))}
.seams .gl{opacity:0}

@keyframes sgd{0%{opacity:0}35%{opacity:.8}100%{opacity:1}}
.seams .fw{stroke-dasharray:14 86;stroke-dashoffset:14;opacity:0;filter:drop-shadow(0 0 3px #ffc766)}

@keyframes sfw{from{stroke-dashoffset:14}to{stroke-dashoffset:-100}}
.orn{gap:9px!important}.orn svg{display:block;flex:none}
